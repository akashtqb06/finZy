services:
  postgres:
    image: postgres:16
    container_name: finzy-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bi_password_123!
      POSTGRES_DB: bikit_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bikit_dev"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
